<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grind Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #060b10;
            --bg-soft: #0d141d;
            --surface: rgba(17, 24, 39, 0.9);
            --border: #263241;
            --green: #3fb950;
            --blue: #58a6ff;
            --muted: #8b949e;
            --fg: #e6edf3;
            --yellow: #e3b341;
            --red: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background:
                radial-gradient(circle at top left, rgba(88,166,255,0.15), transparent 24%),
                linear-gradient(135deg, #02050a 0%, var(--bg) 55%, #09131d 100%);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 44px 44px;
            opacity: 0.18;
        }
        .navbar {
            background: rgba(10, 15, 24, 0.82) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .navbar-brand { color: var(--blue) !important; font-weight: 700; letter-spacing: 0.02em; }
        .navbar-brand span { color: var(--green); }
        .nav-link { color: var(--muted) !important; }
        .nav-link:hover { color: var(--fg) !important; }
        .btn {
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .btn-primary { background: transparent; border: 1px solid var(--blue); color: var(--blue); }
        .btn-primary:hover { background: var(--blue); color: var(--bg); }
        .btn-success { background: transparent; border: 1px solid var(--green); color: var(--green); }
        .btn-success:hover { background: var(--green); color: var(--bg); }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.2);
            backdrop-filter: blur(12px);
        }
        .form-control, .form-select {
            background: rgba(5, 10, 15, 0.9);
            border: 1px solid var(--border);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            border-radius: 10px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(5, 10, 15, 0.95);
            border-color: var(--blue);
            color: var(--fg);
            box-shadow: 0 0 0 3px rgba(88,166,255,0.14);
        }
        .form-label { color: var(--muted); font-size: 0.8rem; }
        .page-shell { max-width: 940px; margin: 0 auto; padding-top: 24px; }
        .hero-panel {
            text-align: center;
            padding: 42px 28px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(63,185,80,0.12), rgba(88,166,255,0.08));
            border: 1px solid var(--border);
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
        }
        .stat-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 12px 28px rgba(0,0,0,0.16);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, var(--blue), transparent);
        }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--blue); }
        .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
        .stat-card.green .stat-value { color: var(--green); }
        .stat-card.yellow .stat-value { color: var(--yellow); }
        .entry-row {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }
        .entry-row:hover { border-color: var(--blue); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,0.16); }
        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .alert-error {
            background: rgba(248,81,73,0.1);
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.82rem;
        }
        .alert-success {
            background: rgba(63,185,80,0.1);
            border: 1px solid var(--green);
            color: var(--green);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><span>&lt;/&gt;</span> grind-tracker</a>
            <div class="d-flex gap-2" id="nav-auth">
                <a href="/login" class="btn btn-sm btn-primary">login</a>
                <a href="/register" class="btn btn-sm btn-success">register</a>
            </div>
        </div>
    </nav>
    <div class="container py-4">
        <div id="app-content"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/tracker/js/app.js"></script>
</body>
</html>
